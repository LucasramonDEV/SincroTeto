<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white rounded-lg shadow-md w-96 overflow-hidden">
        <div class="p-8 text-center">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">SincroTeto</h1>
            <p class="text-gray-600 mb-6">Acesse a sua conta</p>
            
            {% if error %}
                <p class="text-red-500 mb-4 text-sm">{{ error }}</p>
            {% endif %}
            
            <form action="/login" method="POST" class="space-y-4">
                <input type="text" name="login" placeholder="Usuário" class="w-full p-3 border border-gray-300 rounded focus:outline-none focus:border-blue-500 text-center" required>
                <input type="password" name="senha" placeholder="Senha" class="w-full p-3 border border-gray-300 rounded focus:outline-none focus:border-blue-500 text-center" required>
                <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700 transition duration-200">Entrar</button>
            </form>
            <div class="mt-4 pt-4 border-t border-gray-100 text-xs text-gray-400">
                <p><strong>Admin:</strong> usuario: <em>admin</em> | senha: <em>admin123</em></p>
                <p><strong>Lucas:</strong> usuario: <em>lucas</em> | senha: <em>12345</em></p>
            </div>
        </div>
    </div>
</body>
</html>
