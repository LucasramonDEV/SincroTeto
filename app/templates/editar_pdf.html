<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SincroTeto - Editar PDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 p-4 text-white flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold">Portal do Hóspede (PDF)</h1>
        <a href="/propriedade/{{ propriedade.id }}" class="hover:underline">Voltar</a>
    </nav>

    <main class="p-8 max-w-4xl mx-auto space-y-8">
        <div class="bg-white rounded-lg shadow p-6 border-t-4 border-indigo-500">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">📄 Configurar Conteúdo do PDF</h2>
            <p class="text-gray-500 mb-6 text-sm">Altere as informações que serão impressas no PDF entregue ao seu cliente.</p>
            
            <form action="/propriedade/{{ propriedade.id }}/editar_pdf" method="POST" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Rede Wi-Fi</label>
                        <input type="text" name="pdf_wifi_rede" value="{{ propriedade.pdf_wifi_rede }}" class="mt-1 w-full p-2 border border-gray-300 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Senha do Wi-Fi</label>
                        <input type="text" name="pdf_wifi_senha" value="{{ propriedade.pdf_wifi_senha }}" class="mt-1 w-full p-2 border border-gray-300 rounded">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Regras da Casa</label>
                    <textarea name="pdf_regras_casa" rows="4" class="mt-1 w-full p-2 border border-gray-300 rounded">{{ propriedade.pdf_regras_casa }}</textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Guia de Uso (Ar, Jacuzzi, TV)</label>
                    <textarea name="pdf_guia_uso" rows="4" class="mt-1 w-full p-2 border border-gray-300 rounded">{{ propriedade.pdf_guia_uso }}</textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Contatos de Emergência</label>
                    <textarea name="pdf_contatos_emergencia" rows="3" class="mt-1 w-full p-2 border border-gray-300 rounded">{{ propriedade.pdf_contatos_emergencia }}</textarea>
                </div>
                <div class="pt-2 text-right">
                    <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded font-bold hover:bg-indigo-700">Salvar e Atualizar PDF</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
